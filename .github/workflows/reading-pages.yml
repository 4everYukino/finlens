name: Deploy reading station to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  HUGO_VERSION: '0.166.0'
  BLOWFISH_VERSION: 'v3.10.0'

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install Hugo Extended
        working-directory: ${{ runner.temp }}
        env:
          HUGO_ARCHIVE_SHA256: '0e39b901e3f919f1daae05c8ff64f0c14c8a348ef46886d63f8e6d1bb2653885'
        run: |
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/$archive"
          printf '%s  %s\n' "$HUGO_ARCHIVE_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" hugo
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install site dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          git clone --depth 1 --branch "$BLOWFISH_VERSION" https://github.com/nunocoracao/blowfish.git themes/blowfish
          npm ci

      - name: Build site and search index
        env:
          HUGO_BASEURL: ${{ steps.pages.outputs.base_url }}/
        run: npm run reading:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
